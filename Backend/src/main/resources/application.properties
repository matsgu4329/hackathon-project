spring.application.name=SkinClock

server.port=8080

# H2 in-memory database (MVP; data is lost on restart - see SkinClock_SPEC.md risks section)
spring.datasource.url=jdbc:h2:mem:skinclock;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Weather API settings
# KMA (기상청) API key - leave blank to use Open-Meteo fallback automatically
skinclock.weather.kma.service-key=
# Default coordinates: Seoul (서울)
skinclock.weather.default-latitude=37.5665
skinclock.weather.default-longitude=126.9780
